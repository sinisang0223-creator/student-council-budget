<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>budget.js 테스트</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    .pass { color: #1a7f37; }
    .fail { color: #cf222e; font-weight: bold; }
    #summary { font-size: 1.2em; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>budget.js 테스트</h1>
  <p id="summary"></p>
  <ul id="results"></ul>

  <script src="budget.js"></script>
  <script>
    let passCount = 0;
    let failCount = 0;

    // 실제 결과(actual)가 기대한 값(expected)과 같은지 확인하고 화면에 적는다
    function check(name, actual, expected) {
      const ok = actual === expected;
      const li = document.createElement("li");
      li.className = ok ? "pass" : "fail";
      li.textContent = (ok ? "✅ " : "❌ ") + name
        + (ok ? "" : " — 기대: " + expected + ", 실제: " + actual);
      document.getElementById("results").appendChild(li);
      if (ok) { passCount++; } else { failCount++; }
    }

    // 금액 읽기
    check("숫자 800000", parseAmount(800000), 800000);
    check("1원", parseAmount(1), 1);
    check("0원은 잘못된 값", parseAmount(0), null);
    check("글자 \"0\"은 잘못된 값", parseAmount("0"), null);
    check("쉼표 금액 \"800,000\"", parseAmount("800,000"), 800000);
    check("쉼표와 원 \"800,000원\"", parseAmount("800,000원"), 800000);
    check("음수 -1000은 잘못된 값", parseAmount(-1000), null);
    check("음수 글자 \"-1,000\"은 잘못된 값", parseAmount("-1,000"), null);
    check("소수 1000.5는 잘못된 값", parseAmount(1000.5), null);
    check("소수 글자 \"1000.5\"는 잘못된 값", parseAmount("1000.5"), null);
    check("글자 \"abc\"는 잘못된 값", parseAmount("abc"), null);
    check("빈 값 \"\"은 잘못된 값", parseAmount(""), null);
    check("최소 0원으로 읽으면 0원도 허용", parseAmount(0, 0), 0);
    check("최소 0원으로 읽어도 음수는 잘못된 값", parseAmount(-1, 0), null);

    // 입력 검사 (잘못된 이유)
    check("정상 금액은 오류 없음", checkAmount("800000").error, null);
    check("정상 금액 읽기", checkAmount("800000").amount, 800000);
    check("쉼표 금액 읽기", checkAmount("800,000").amount, 800000);
    check("쉼표와 원 읽기", checkAmount("800,000원").amount, 800000);
    check("앞뒤 공백은 무시", checkAmount("  1000  ").amount, 1000);
    check("1원은 통과", checkAmount("1").amount, 1);
    check("빈 값", checkAmount("").error, "금액을 입력해 주세요.");
    check("공백만 입력", checkAmount("   ").error, "금액을 입력해 주세요.");
    check("글자", checkAmount("abc").error, "숫자만 입력해 주세요.");
    check("숫자와 글자 섞임", checkAmount("10만원").error, "숫자만 입력해 주세요.");
    check("1e3 같은 지수 표기는 글자로 봄", checkAmount("1e3").error, "숫자만 입력해 주세요.");
    check("0x10 같은 16진수는 글자로 봄", checkAmount("0x10").error, "숫자만 입력해 주세요.");
    check("소수", checkAmount("1000.5").error, "원 단위 정수로 입력해 주세요.");
    check("0원", checkAmount("0").error, "1원 이상 입력해 주세요.");
    check("음수", checkAmount("-1,000").error, "1원 이상 입력해 주세요.");
    check("잘못되면 금액은 null", checkAmount("abc").amount, null);

    // 사용률
    check("사용률 50%", calcUsageRate(800000, 400000), 50);
    check("정확히 100%", calcUsageRate(800000, 800000), 100);
    check("100% 초과 (125%)", calcUsageRate(800000, 1000000), 125);
    check("사용률은 반올림하지 않음 (1/3은 33.3보다 큼)", calcUsageRate(3, 1) > 33.33, true);
    check("쓴 돈 0원이면 0%", calcUsageRate(800000, 0), 0);
    check("예산 0원이면 계산 불가", calcUsageRate(0, 1000), null);
    check("쉼표 금액으로 사용률", calcUsageRate("800,000", "200,000"), 25);
    check("글자 입력이면 사용률 계산 불가", calcUsageRate("abc", 1000), null);

    // 남은 금액
    check("남은 금액", calcRemaining(800000, 300000), 500000);
    check("정확히 100%면 남은 금액 0원", calcRemaining(800000, 800000), 0);
    check("초과하면 남은 금액이 음수", calcRemaining(800000, 1000000), -200000);
    check("음수 입력이면 남은 금액 계산 불가", calcRemaining(800000, -1), null);
    check("쓴 돈 0원이면 예산 전체가 남음", calcRemaining(800000, 0), 800000);

    // 사용률 막대 길이
    check("막대 50%", calcBarWidth(800000, 400000), 50);
    check("막대는 반올림하지 않음 (1/3)",
      calcBarWidth(3, 1) > 33.33 && calcBarWidth(3, 1) < 33.34, true);
    check("정확히 100%면 막대 100", calcBarWidth(800000, 800000), 100);
    check("112% 초과여도 막대는 100에서 멈춤", calcBarWidth(500000, 560000), 100);
    check("1원 초과여도 막대는 100", calcBarWidth(800000, 800001), 100);
    check("지출 0원이면 막대 0", calcBarWidth(800000, 0), 0);
    check("예산 0원이면 막대 계산 불가", calcBarWidth(0, 1000), null);
    check("글자 입력이면 막대 계산 불가", calcBarWidth(800000, "abc"), null);

    // 초과 판단
    check("100% 미만은 초과 아님", isOverBudget(800000, 799999), false);
    check("정확히 100%는 초과 아님", isOverBudget(800000, 800000), false);
    check("100% 초과", isOverBudget(800000, 800001), true);
    check("예산 0원이면 초과 판단 불가", isOverBudget(0, 1), null);
    check("소수 입력이면 초과 판단 불가", isOverBudget(800000, 0.5), null);
    check("쓴 돈 0원은 초과 아님", isOverBudget(800000, 0), false);

    // 상태 판단
    check("100% 미만은 정상", getStatus(800000, 667200), "정상");
    check("99.96%(1,000,000원 중 999,600원)는 정상", getStatus(1000000, 999600), "정상");
    check("지출 = 예산이면 주의", getStatus(800000, 800000), "주의");
    check("쉼표 금액도 같으면 주의", getStatus("800,000원", 800000), "주의");
    check("1원이라도 넘으면 초과", getStatus(800000, 800001), "초과");
    check("잘못된 입력이면 상태 판단 불가", getStatus(800000, "abc"), null);
    check("쓴 돈 0원이면 정상", getStatus(800000, 0), "정상");
    check("쓴 돈 음수면 상태 판단 불가", getStatus(800000, -1), null);

    // 지출 누적 입력
    check("지출 더하기", addSpending(700000, "100,000").spent, 800000);
    check("지출 더하기는 오류 없음", addSpending(700000, "100,000").error, null);
    check("지출 0원인 새 행사에 더하기", addSpending(0, "50000원").spent, 50000);
    check("두 번 나눠 더하기", addSpending(addSpending(0, "300,000").spent, "200,000").spent, 500000);
    check("더해서 정확히 100%가 되면 주의",
      getStatus(800000, addSpending(700000, "100,000").spent), "주의");
    check("더해서 1원이라도 넘으면 초과",
      getStatus(800000, addSpending(700000, "100,001").spent), "초과");
    check("더해도 100% 미만이면 정상",
      getStatus(800000, addSpending(700000, "99,999").spent), "정상");
    check("빈 값은 더하지 않음", addSpending(700000, "").error, "금액을 입력해 주세요.");
    check("글자는 더하지 않음", addSpending(700000, "abc").error, "숫자만 입력해 주세요.");
    check("소수는 더하지 않음", addSpending(700000, "1000.5").error, "원 단위 정수로 입력해 주세요.");
    check("0원은 더하지 않음", addSpending(700000, "0").error, "1원 이상 입력해 주세요.");
    check("음수는 더하지 않음 (지출 빼기 불가)", addSpending(700000, "-1000").error, "1원 이상 입력해 주세요.");
    check("잘못되면 지출은 null", addSpending(700000, "abc").spent, null);

    // 합계
    const sampleEvents = [
      { name: "신입생 환영회", budget: 800000, spent: 667200 },
      { name: "체육대회", budget: 1200000, spent: 1200000 },
      { name: "학과 축제 부스", budget: 500000, spent: 560000 }
    ];
    const totals = calcTotals(sampleEvents);
    // 같은 이름 행사 확인
    check("이미 있는 이름", hasEventName(sampleEvents, "체육대회"), true);
    check("앞뒤 공백이 있어도 같은 이름", hasEventName(sampleEvents, "  체육대회  "), true);
    check("목록 쪽 이름에 공백이 있어도 같은 이름",
      hasEventName([{ name: " 개강총회 ", budget: 1000, spent: 0 }], "개강총회"), true);
    check("가운데 공백이 다르면 다른 이름", hasEventName(sampleEvents, "체육 대회"), false);
    check("없는 이름", hasEventName(sampleEvents, "동아리 박람회"), false);
    check("빈 목록이면 항상 없음", hasEventName([], "체육대회"), false);

    check("총 예산 합계", totals.budget, 2500000);
    check("총 지출 합계", totals.spent, 2427200);
    check("쉼표 금액도 더함", calcTotals([{ budget: "1,000", spent: "500원" }]).budget, 1000);
    check("잘못된 금액이 있으면 합계 불가",
      calcTotals([{ budget: 1000, spent: 500 }, { budget: 0, spent: 500 }]), null);
    check("빈 목록이면 총 예산 0", calcTotals([]).budget, 0);
    check("지출 0원인 새 행사도 합계에 들어감",
      calcTotals([{ budget: 1000, spent: 0 }, { budget: 2000, spent: 500 }]).budget, 3000);

    // 저장된 목록 읽기
    const savedText = JSON.stringify(sampleEvents);
    check("저장한 목록을 그대로 되돌림",
      JSON.stringify(parseSavedEvents(savedText)), savedText);
    check("지출 0원인 행사도 읽음",
      parseSavedEvents('[{"name":"개강총회","budget":1000,"spent":0}]')[0].spent, 0);
    check("빈 목록도 읽음", parseSavedEvents("[]").length, 0);
    check("저장된 것이 없으면 null", parseSavedEvents(null), null);
    check("빈 글자면 null", parseSavedEvents(""), null);
    check("JSON 모양이 깨지면 null", parseSavedEvents('[{"name":'), null);
    check("목록이 아니면 null", parseSavedEvents('{"name":"체육대회"}'), null);
    check("행사 자리에 숫자가 있으면 null", parseSavedEvents("[1]"), null);
    check("행사 자리에 null이 있으면 null", parseSavedEvents("[null]"), null);
    check("행사명이 비어 있으면 null",
      parseSavedEvents('[{"name":"  ","budget":1000,"spent":0}]'), null);
    check("행사명이 없으면 null", parseSavedEvents('[{"budget":1000,"spent":0}]'), null);
    check("같은 이름이 두 번 있으면 null",
      parseSavedEvents('[{"name":"체육대회","budget":1000,"spent":0},'
        + '{"name":" 체육대회 ","budget":2000,"spent":0}]'), null);
    check("예산 0원이면 null", parseSavedEvents('[{"name":"체육대회","budget":0,"spent":0}]'), null);
    check("지출이 음수면 null", parseSavedEvents('[{"name":"체육대회","budget":1000,"spent":-1}]'), null);
    check("지출이 소수면 null", parseSavedEvents('[{"name":"체육대회","budget":1000,"spent":0.5}]'), null);
    check("지출이 없으면 null", parseSavedEvents('[{"name":"체육대회","budget":1000}]'), null);
    check("하나만 잘못돼도 전체 null",
      parseSavedEvents('[{"name":"체육대회","budget":1000,"spent":0},'
        + '{"name":"개강총회","budget":"abc","spent":0}]'), null);
    check("다른 값이 섞여 있으면 버림",
      JSON.stringify(parseSavedEvents('[{"name":"체육대회","budget":1000,"spent":0,"memo":"x"}]')),
      '[{"name":"체육대회","budget":1000,"spent":0}]');

    // 상태별 개수
    const sampleCounts = countStatuses(sampleEvents);
    check("예시 행사 정상 개수", sampleCounts["정상"], 1);
    check("예시 행사 주의 개수", sampleCounts["주의"], 1);
    check("예시 행사 초과 개수", sampleCounts["초과"], 1);
    check("같은 상태가 여럿이면 더함",
      countStatuses([{ budget: 1000, spent: 0 }, { budget: 1000, spent: 999 }])["정상"], 2);
    check("없는 상태는 0", countStatuses([{ budget: 1000, spent: 0 }])["초과"], 0);
    check("빈 목록이면 모두 0", countStatuses([])["정상"], 0);
    check("잘못된 금액이 있으면 null", countStatuses([{ budget: 0, spent: 0 }]), null);

    // CSV 칸 글자
    check("보통 글자는 그대로", escapeCsvCell("체육대회"), "체육대회");
    check("쉼표가 있으면 따옴표로 감쌈", escapeCsvCell("MT, 1박 2일"), '"MT, 1박 2일"');
    check("따옴표는 두 번 쓰고 감쌈", escapeCsvCell('"밤샘" 축제'), '"""밤샘"" 축제"');
    check("줄바꿈이 있으면 감쌈", escapeCsvCell("1부\n2부"), '"1부\n2부"');
    check("=로 시작하면 '를 붙임", escapeCsvCell("=1+1"), "'=1+1");
    check("+로 시작하면 '를 붙임", escapeCsvCell("+행사"), "'+행사");
    check("-로 시작하면 '를 붙임", escapeCsvCell("-행사"), "'-행사");
    check("@로 시작하면 '를 붙임", escapeCsvCell("@행사"), "'@행사");
    check("계산식 모양에 쉼표도 있으면 둘 다", escapeCsvCell("=A1,B1"), "\"'=A1,B1\"");
    check("가운데 =는 그대로", escapeCsvCell("1=1 행사"), "1=1 행사");

    // CSV 만들기
    const csvLines = makeCsv(sampleEvents).split("\r\n");
    check("CSV 줄 수 (머리 1 + 행사 3 + 합계 1)", csvLines.length, 5);
    check("CSV 머리 줄", csvLines[0], "행사명,예산,지출,남은 금액,사용률,상태");
    check("정상 행사 줄", csvLines[1], "신입생 환영회,800000,667200,132800,83.4%,정상");
    check("주의 행사 줄", csvLines[2], "체육대회,1200000,1200000,0,100.0%,주의");
    check("초과 행사 줄 (남은 금액 음수)", csvLines[3], "학과 축제 부스,500000,560000,-60000,112.0%,초과");
    check("합계 줄 (상태 칸은 비움)", csvLines[4], "합계,2500000,2427200,72800,97.1%,");
    check("지출 0원 행사",
      makeCsv([{ name: "개강총회", budget: 300000, spent: 0 }]).split("\r\n")[1],
      "개강총회,300000,0,300000,0.0%,정상");
    check("쉼표 든 행사명도 한 칸",
      makeCsv([{ name: "MT, 1박 2일", budget: 1000, spent: 0 }]).split("\r\n")[1],
      '"MT, 1박 2일",1000,0,1000,0.0%,정상');
    check("99.96%는 화면처럼 99.9%",
      makeCsv([{ name: "체육대회", budget: 1000000, spent: 999600 }]).split("\r\n")[1],
      "체육대회,1000000,999600,400,99.9%,정상");
    check("잘못된 금액이 있으면 null", makeCsv([{ name: "체육대회", budget: 0, spent: 0 }]), null);
    check("빈 목록이면 머리 줄과 합계 줄만", makeCsv([]), "행사명,예산,지출,남은 금액,사용률,상태\r\n합계,0,0,,,");

    // CSV 파일 이름
    check("보통 이름은 통과", checkFileName("학생회-예산-2026-11-01"), null);
    check("공백과 괄호는 통과", checkFileName("2학기 결산 (최종)"), null);
    for (const char of ["/", "\\", ":", "*", "?", '"', "<", ">", "|"]) {
      check("쓸 수 없는 글자 " + char, checkFileName("결산" + char + "최종"),
        "파일 이름에 쓸 수 없는 글자가 있습니다: " + char);
    }
    check("쓸 수 없는 글자 여러 개", checkFileName("a/b:c"),
      "파일 이름에 쓸 수 없는 글자가 있습니다: / :");
    check("끝에 .csv를 붙임", makeCsvFileName("2학기 결산", "기본"), "2학기 결산.csv");
    check("이미 .csv면 또 붙이지 않음", makeCsvFileName("결산.csv", "기본"), "결산.csv");
    check("대문자 .CSV도 또 붙이지 않음", makeCsvFileName("결산.CSV", "기본"), "결산.CSV");
    check("앞뒤 공백은 지움", makeCsvFileName("  결산  ", "기본"), "결산.csv");
    check("빈 값이면 기본 이름", makeCsvFileName("", "학생회-예산-2026-11-01"), "학생회-예산-2026-11-01.csv");
    check("공백만 있으면 기본 이름", makeCsvFileName("   ", "기본"), "기본.csv");
    check(".csv만 있으면 기본 이름", makeCsvFileName(".csv", "기본"), "기본.csv");
    check("가운데 .csv는 그대로 두고 붙임", makeCsvFileName("a.csv.b", "기본"), "a.csv.b.csv");

    // 금액 표시
    check("800,000원 표시", formatWon(800000), "800,000원");
    check("0원 표시", formatWon(0), "0원");
    check("음수 표시", formatWon(-200000), "-200,000원");

    // 사용률 표시
    check("83.36%는 83.4%로 표시", formatRate(83.36), "83.4%");
    check("834/1000은 83.4%로 표시", formatRate(calcUsageRate(1000, 834)), "83.4%");
    check("1/3은 33.3%로 표시", formatRate(calcUsageRate(3, 1)), "33.3%");
    check("99.96%(1,000,000원 중 999,600원)는 99.9%로 표시",
      formatRate(calcUsageRate(1000000, 999600)), "99.9%");
    check("99.99%도 99.9%로 표시", formatRate(99.99), "99.9%");
    check("99.94%는 원래대로 99.9%로 표시", formatRate(99.94), "99.9%");
    check("99.84%는 원래대로 99.8%로 표시", formatRate(99.84), "99.8%");
    check("정확히 100%는 100.0%로 표시", formatRate(calcUsageRate(800000, 800000)), "100.0%");
    check("100.04%(1,000,000원 중 1,000,400원)는 100.1%로 표시",
      formatRate(calcUsageRate(1000000, 1000400)), "100.1%");
    check("100.05%는 100.1%로 표시", formatRate(100.05), "100.1%");
    check("112%는 112.0%로 표시", formatRate(calcUsageRate(500000, 560000)), "112.0%");
    check("125%는 125.0%로 표시", formatRate(calcUsageRate(800000, 1000000)), "125.0%");
    check("0%는 0.0%로 표시", formatRate(calcUsageRate(800000, 0)), "0.0%");
    check("계산 불가(null)면 빈 글자", formatRate(null), "");

    document.getElementById("summary").textContent =
      "통과 " + passCount + "개 / 실패 " + failCount + "개";
    document.getElementById("summary").className = failCount === 0 ? "pass" : "fail";
  </script>
</body>
