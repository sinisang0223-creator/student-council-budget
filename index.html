<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학생회 행사 예산 현황</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>학생회 행사 예산 현황</h1>

    <!-- 전체 요약: app.js가 값을 채운다 -->
    <section class="summary">
      <div class="card">
        <p class="card-label">총 예산</p>
        <p class="card-value" id="total-budget"></p>
      </div>
      <div class="card">
        <p class="card-label">총 지출</p>
        <p class="card-value" id="total-spent"></p>
      </div>
      <div class="card">
        <p class="card-label">남은 금액</p>
        <p class="card-value" id="total-remaining"></p>
      </div>
      <div class="card">
        <p class="card-label">전체 사용률</p>
        <p class="card-value" id="total-rate"></p>
      </div>
    </section>

    <!-- 행사별 표: app.js가 행사마다 한 줄씩 채운다 -->
    <section>
      <h2>행사별 예산</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>행사명</th>
              <th class="num">예산</th>
              <th class="num">지출</th>
              <th class="num">남은 금액</th>
              <th class="num">사용률</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody id="event-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 순서 중요: app.js가 budget.js 함수를 쓰므로 budget.js를 먼저 불러온다 -->
  <script src="budget.js"></script>
  <script src="app.js"></script>
</body>
</html>
